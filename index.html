
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Govinda Chauhan</title>
    <meta name="description" content="Software engineer — agent infrastructure, evaluation systems, research prototypes, and full-stack products." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Italianno&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              display: ['Space Grotesk', 'Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
              serif: ['Source Serif 4', 'Georgia', 'serif'],
              signature: ['Italianno', 'cursive'],
            },
            colors: {
              background: 'var(--background)',
              foreground: 'var(--foreground)',
            },
            letterSpacing: {
              tighter: '-0.05em',
              tight: '-0.025em',
            },
          }
        }
      }
    </script>
    <style>
      :root {
        /* Warmer light paper */
        --background: #FAF8F5;
        --foreground: #1c1917;
        --card-bg: rgba(255, 255, 255, 0.6);
        --card-border: #e7e5e4;
      }
      html {
        -webkit-text-size-adjust: 100%;
        max-width: 100%;
      }
      body {
        background-color: var(--background);
        color: var(--foreground);
        font-family: 'Inter', system-ui, sans-serif;
        line-height: 1.55;
        overflow-x: hidden;
        max-width: 100%;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        min-height: 100%;
        max-width: 100%;
        overflow-x: clip;
      }
      .page-paper {
        background-color: #FAF8F5;
        background-image:
          radial-gradient(ellipse 120% 80% at 50% -10%, rgba(255, 252, 247, 0.95), transparent 55%),
          linear-gradient(180deg, #FAF8F5 0%, #F5F2EC 100%);
        /* clip x only — keep hero card free of touch scrollbars */
        overflow-x: clip;
        overflow-y: visible;
        width: 100%;
        max-width: 100%;
      }
      img, video, iframe {
        max-width: 100%;
      }
      /* Full mobile: no horizontal bleed, readable type, safe taps */
      @media (max-width: 640px) {
        #research, #products, #github, #papers, footer {
          overflow-wrap: anywhere;
          word-break: break-word;
        }
        #research, #products, #github, #papers {
          padding-left: max(0.75rem, env(safe-area-inset-left));
          padding-right: max(0.75rem, env(safe-area-inset-right));
        }
        button, a {
          -webkit-tap-highlight-color: transparent;
        }
      }
      a {
        color: #1839A7;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      /* Soft horizontal scrollbar for work strip */
      #work-strip [class*="overflow-x"]::-webkit-scrollbar {
        height: 6px;
      }
      #work-strip [class*="overflow-x"]::-webkit-scrollbar-thumb {
        background: #d6d3d1;
        border-radius: 999px;
      }
      .line-clamp-3 {
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      /* Product demos: keep scroll, hide scrollbar chrome */
      .product-demo-scroll {
        scrollbar-width: none; /* Firefox */
        -ms-overflow-style: none; /* IE/legacy */
      }
      .product-demo-scroll::-webkit-scrollbar {
        width: 0 !important;
        height: 0 !important;
        display: none !important;
        background: transparent;
      }
      .product-demo-frame {
        scrollbar-width: none;
      }
      .product-demo-frame::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.25",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^0.1.2"
  }
}
</script>
</head>

    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
